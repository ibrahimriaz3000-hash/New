name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip if app folder is missing
        run: |
          if [ ! -d app ]; then
            ZIP=$(ls DynamicPill*.zip | head -n 1)
            echo "app/ not found, extracting $ZIP"
            unzip -o "$ZIP"
          fi
          test -f app/build.gradle
          ls -R app | head -50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and release APK
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DynamicPill-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
