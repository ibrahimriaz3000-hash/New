name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Xposed API repo is reachable
        run: |
          curl -sSfI --retry 5 --retry-delay 5 \
            https://api.xposed.info/de/robv/android/xposed/api/82/api-82.pom \
            || echo "Warning: api.xposed.info not reachable right now"

      - name: Build debug and release APK
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DynamicPill-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
